      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;

      font-family: Arial, sans-serif;
    }
    .card {
      background: #fff;
      border-radius: 16px;
      padding: 40px;
      width: 95%;
      height: 95%;
      box-shadow: 0 8px 30px rgba(0,0,0,0.15);
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 40px;
      align-items: flex-start;
    }
    /* Profile */
    .profile {
      text-align: center;
    }
    .profile img {
      width: 180px;
      height: 180px;
      border-radius: 50%;
      object-fit: cover;
      box-shadow: 0 6px 14px rgba(0,0,0,0.25);
    }
    .profile h1 {
      font-size: 28px;
      margin: 15px 0 5px;
    }
    .profile h2 {
      font-size: 18px;
      color: #666;
      margin-bottom: 15px;
    }
    .profile .actions a {
      padding: 10px 18px;
      background: #007bff;
      color: #fff;
      border-radius: 6px;
      text-decoration: none;
      font-size: 15px;
    }
    .icons a {
      margin: 0 8px;
      font-size: 16px;
      color: #007bff;
      text-decoration: none;
    }

    /* Info */
    .info h3 {
      margin: 10px 0;
      font-size: 20px;
      border-bottom: 2px solid #eee;
      padding-bottom: 6px;
    }
    .projects ul {
      margin: 10px 0;
      padding: 0;
      list-style: none;
    }
    .projects li {
      font-size: 16px;
      margin-bottom: 8px;
    }
    .projects a {
      color: #007bff;
      text-decoration: none;
    }

    /* Contact smaller */
    .contact ul {
      margin: 10px 0;
      padding: 0;
      list-style: none;
    }
    .contact li {
      font-size: 14px;
      margin-bottom: 5px;
      color: #444;
    }
    .contact a {
      color: #007bff;
      text-decoration: none;
    }
  </style>
</head>
