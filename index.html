<!DOCTYPE HTML>

  <title>Gilbert Terer | Data Scientist</title>
  <style>
    body {

      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background: #f8f9fa;
      font-family: Arial, sans-serif;
    }
    .card {
      background: #fff;
      border-radius: 16px;
      padding: 30px 40px;
      max-width: 1200px; /* wider */
      width: 95%;
      height: 85vh; /* taller to cover more screen */
      box-shadow: 0 8px 30px rgba(0,0,0,0.15);
      display: grid;
      grid-template-columns: 250px 1fr; /* bigger left panel */
      gap: 35px;
      align-items: start;
    }
    .profile {
      text-align: center;
    }
    .profile img {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      object-fit: cover;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
    }
    .profile h1 {
      font-size: 24px;
      margin: 12px 0 6px;
    }
    .profile h2 {
      font-size: 16px;
      color: #666;
      margin-bottom: 12px;
    }
    .profile .actions a {
      padding: 8px 14px;
      background: #007bff;
      color: #fff;
      border-radius: 6px;
      text-decoration: none;
      font-size: 14px;
    }
    .info h3 {
      margin: 5px 0;
      font-size: 18px;
      border-bottom: 1px solid #eee;
      padding-bottom: 4px;
    }
    .projects {
      margin-bottom: 20px;
    }
    .projects ul {
      margin: 8px 0;
      padding: 0;
      list-style: none;
    }
    .projects li {
      font-size: 15px;
      margin-bottom: 6px;
    }
    .projects a {
      color: #007bff;
      text-decoration: none;
    }
    .contact {
      font-size: 13px; /* reduced size */
      opacity: 0.9;
    }
    .contact ul {
      margin: 5px 0;
      padding: 0;
      list-style: none;
    }
    .contact li {
      margin-bottom: 3px;
    }
    .icons a {
      margin-right: 8px;
      font-size: 14px;
      color: #007bff;
      text-decoration: none;
    }
  </style>
</head>
